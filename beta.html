<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guðmundr Beta — application portfolio</title>
<meta name="robots" content="noindex">
<!-- The beta portal now lives behind Gudmundr Gateway sign-in on the apps host.
     Served at gateway.gudmundr.com/apps/ (three places below). -->
<meta http-equiv="refresh" content="0; url=https://gateway.gudmundr.com/apps/">
<link rel="canonical" href="https://gateway.gudmundr.com/apps/">
<script>window.location.replace('https://gateway.gudmundr.com/apps/');</script>
<style>
:root { --background: #FFFFFF; --text-primary: #000000; --text-secondary: #333333; --accent-heritage: #385E3F; --border: #E3E4E5; }
@media (prefers-color-scheme: dark) {
  :root { --background: #000000; --text-primary: #FFFFFF; --text-secondary: #CCCCCC; --accent-heritage: #A1BFA6; --border: #333333; }
}
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 2rem; box-sizing: border-box; background: var(--background); color: var(--text-primary);
  font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; text-align: center; }
.brand { font-size: clamp(2.5rem, 8vw, 4rem); letter-spacing: -0.02em; line-height: 1; margin-bottom: 12px; }
.eth { color: var(--accent-heritage); }
p { font-style: italic; color: var(--text-secondary); font-size: 1.1rem; }
a { color: var(--text-primary); border-bottom: 1px solid var(--border); text-decoration: none; }
a:hover { border-bottom-color: var(--accent-heritage); }
</style>
</head>
<body>
  <div class="brand">Gu<span class="eth">ð</span>mundr</div>
  <p>The beta portal has moved behind sign-in.<br>
     <a href="https://gateway.gudmundr.com/apps/">Continue to the beta portal</a></p>
</body>
</html>
