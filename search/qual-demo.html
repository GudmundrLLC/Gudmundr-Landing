<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search · Qual Demo · Guðmundr</title>
<meta name="description" content="Compact search page for Qual Demo · mobile · drawer · tray · sidecar friendly.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF;--surface:#F5F5F5;--fg:#000;--fg2:#333;--muted:#999;--heritage:#385E3F;--warm:#D94927;--border:#E3E4E5;--f-serif:'EB Garamond',Georgia,serif;--f-sans:'Inter',system-ui,sans-serif;--f-mono:'JetBrains Mono',monospace}
[data-theme="dark"]{--bg:#000;--surface:#111;--fg:#FFF;--fg2:#CCC;--muted:#666;--heritage:#A1BFA6;--border:#333}
*{margin:0;padding:0;box-sizing:border-box}html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f-sans);font-weight:300;background:var(--bg);color:var(--fg);line-height:1.5;min-height:100vh;padding:1rem;display:flex;flex-direction:column;justify-content:center;align-items:center}
.wrap{width:100%;max-width:420px}
.toggle{position:absolute;top:12px;right:12px;font-family:var(--f-mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:.35rem .6rem;border:1px solid var(--border);background:var(--bg);color:var(--fg2);cursor:pointer}
.toggle:hover{color:var(--warm);border-color:var(--warm)}
.toggle b{color:var(--fg);margin-right:4px}
.badge{display:inline-block;padding:.25rem .7rem;border:1px solid var(--border);font-family:var(--f-mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem}
h1{font-family:var(--f-serif);font-weight:500;font-size:clamp(1.5rem,5vw,2rem);line-height:1.1;margin-bottom:.3rem;letter-spacing:-.01em}
.eth{color:var(--heritage)}
.sub{font-family:var(--f-serif);font-style:italic;color:var(--fg2);font-size:.95rem;margin-bottom:1.25rem}
form{display:flex;gap:.5rem;margin-bottom:1rem}
input[type=search]{flex:1;min-width:0;font-family:var(--f-sans);font-weight:300;font-size:1rem;padding:.65rem .8rem;border:1px solid var(--border);background:var(--surface);color:var(--fg)}
input[type=search]:focus{outline:none;border-color:var(--heritage)}
button[type=submit]{font-family:var(--f-mono);font-size:.65rem;padding:.65rem 1rem;background:var(--fg);color:var(--bg);border:1px solid var(--fg);text-transform:uppercase;letter-spacing:.12em;cursor:pointer;white-space:nowrap}
button[type=submit]:hover{background:var(--warm);border-color:var(--warm)}
.row{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding-top:.75rem;border-top:1px solid var(--border)}
.row a{color:var(--fg2);text-decoration:none;border-bottom:1px solid var(--border)}
.row a:hover{color:var(--warm);border-color:var(--warm)}
@media(max-width:360px){body{padding:.75rem}h1{font-size:1.4rem}}
</style></head><body>
<button class="toggle" id="tt"><b id="tc">Light</b>/ Dark</button>
<div class="wrap">
  <div class="badge">Qual Demo · Search</div>
  <h1>Search <span class="eth">Qual Demo</span></h1>
  <p class="sub">Pipeline qualification workbench.</p>
  <form id="f" target="_blank">
    <input type="search" id="q" placeholder="Search Qual Demo…" autocomplete="off" autofocus>
    <button type="submit">Go</button>
  </form>
  <div class="row">
    <a href="/search.html">All apps</a>
    <a href="https://worthy-love-production-4d66.up.railway.app/" target="_blank" rel="noopener">Open app ↗</a>
  </div>
</div>
<script>
(function(){var K='gudmundr.theme',r=document.documentElement,b=document.getElementById('tt'),c=document.getElementById('tc'),s=null;try{s=localStorage.getItem(K)}catch(_){}var m=s||((matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');a(m);b.onclick=function(){var n=r.getAttribute('data-theme')==='dark'?'light':'dark';a(n);try{localStorage.setItem(K,n)}catch(_){}};function a(x){r.setAttribute('data-theme',x==='dark'?'dark':'');c.textContent=x==='dark'?'Dark':'Light';b.lastChild.textContent=x==='dark'?'/ Light':'/ Dark'}})();
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var q=document.getElementById('q').value.trim();if(!q)return;var sep='https://worthy-love-production-4d66.up.railway.app/'.indexOf('?')>-1?'&':'?';window.open('https://worthy-love-production-4d66.up.railway.app/'+sep+'q='+encodeURIComponent(q),'_blank','noopener,noreferrer')});
</script></body></html>
